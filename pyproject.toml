[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delhi-metro-planner"
version = "0.1.0"
description = "Interactive Delhi Metro route planner and visualiser (CS-3810 Project 1, Team Starfish)"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4", "networkx>=3.2", "ruff>=0.5", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["metro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running checks (all-pairs oracle on real data)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]  # zip(a, a[1:]) is deliberately unequal in length
