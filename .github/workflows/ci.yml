name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Test (fast)
        run: pytest -m "not slow"
      - name: Test (slow oracle)
        if: runner.os == 'Linux'
        # Exit code 5 means "no tests collected", which is fine before the slow tests exist.
        run: pytest -m slow || [ $? -eq 5 ]
